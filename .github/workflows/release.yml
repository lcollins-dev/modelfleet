name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # Waits on every CI job, so a failing check or test pushes no image and moves no `latest`.
  image:
    name: Build and push the ${{ matrix.app }} image
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [server, agent]
    steps:
      # Fails before anything builds, since a tag that is not semver would leave the image with no version tag.
      - name: Check the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not v<major>.<minor>.<patch>, e.g. v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/lcollins-dev/modelfleet-${{ matrix.app }}
          flavor: latest=false
          # `latest` moves only for a full release: not one marked as a pre-release, and not a suffixed version.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease && !contains(github.event.release.tag_name, '-') }}

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both Dockerfiles take the repository root as their context and copy the workspaces they need from it.
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: build/Dockerfile-${{ matrix.app }}
          platforms: linux/amd64
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
